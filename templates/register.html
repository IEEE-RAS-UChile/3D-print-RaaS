{% extends "base.html" %}
{% block content %}
<section class="page-section register-page" style="padding: 60px 0; background-color: #f8f9fa; min-height: 70vh; display: flex; align-items: center;">
  <div class="container" style="max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
    <h1 style="text-align: center; color: #002855; margin-bottom: 20px; font-size: 28px;">Registro de Alumno</h1>
    
    <form method="POST" action="{{ url_for('register') }}">
      <div style="margin-bottom: 15px;">
        <label for="username" style="display: block; margin-bottom: 5px; font-weight: 500;">Elige un Nombre de Usuario:</label>
        <input type="text" id="username" name="username" required style="width: 100%; padding: 10px; border: 1px solid #dee2e6; border-radius: 4px; box-sizing: border-box;">
      </div>
      
      <div style="margin-bottom: 20px;">
        <label for="password" style="display: block; margin-bottom: 5px; font-weight: 500;">Contraseña:</label>
        <input type="password" id="password" name="password" required style="width: 100%; padding: 10px; border: 1px solid #dee2e6; border-radius: 4px; box-sizing: border-box;">
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%; background-color: #002855; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">
        Crear Cuenta
      </button>
    </form>
    
    <p style="text-align: center; margin-top: 15px; font-size: 14px; color: #6c757d;">
      ¿Ya estás registrado? <a href="{{ url_for('login') }}" style="color: #002855; font-weight: bold;">Inicia sesión aquí</a>
    </p>
  </div>
</section>
{% endblock %}
